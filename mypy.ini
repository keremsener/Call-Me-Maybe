[mypy]
explicit_package_bases = True
mypy_path = packages/mazegen/src
exclude = (?x)(
    ^\.venv/
    | ^\.build/
    | ^build/
    | ^dist/
    | ^llm_sdk/
    | ^packages/mazegen/build/
    | ^packages/maze_analyzer\.py$
    )

[mypy-llm_sdk.*]
follow_imports = skip
ignore_missing_imports = True

[mypy-torch]
ignore_missing_imports = True
